<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コーデ印象判定</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #1e293b;
            background: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
        main {
            width: min(680px, 100%);
            padding: 32px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 8px 24px rgb(15 23 42 / 8%);
        }
        h1 { margin: 0 0 8px; color: #4f46e5; }
        p { margin: 0 0 24px; color: #64748b; }
        nav {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        a {
            padding: 24px;
            border: 1px solid #c7d2fe;
            border-radius: 12px;
            color: #4338ca;
            background: #eef2ff;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 700;
            text-decoration: none;
        }
        a:hover { background: #e0e7ff; }
        @media (max-width: 520px) {
            nav { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main>
        <h1>コーデ印象判定</h1>
        <p>判定するサイトを選択してください。</p>
        <nav>
            <a href="./check-sites/n0_women/">n0 を開く</a>
            <a href="./check-sites/n1_women/">n1 を開く</a>
            <a href="./check-sites/n3_women/">n3 を開く</a>
            <a href="./check-sites/n6_women/">n6 を開く</a>
        </nav>
    </main>
</body>
</html>
